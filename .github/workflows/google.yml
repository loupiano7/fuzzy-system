name: Build and Deploy to GKE

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  GKE_LOCATION: ${{ vars.GKE_LOCATION }}
  DEPLOYMENT_NAME: ${{ vars.GKE_DEPLOYMENT_NAME }}
  REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  IMAGE: ${{ vars.IMAGE_NAME }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  KUSTOMIZE_PATH: ${{ vars.KUSTOMIZE_PATH }}
  KUBERNETES_NAMESPACE: ${{ vars.KUBERNETES_NAMESPACE }}
  KUSTOMIZE_IMAGE: ${{ vars.KUSTOMIZE_IMAGE }}

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: 'actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332' # actions/checkout@v4

      - name: Validate workflow configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${KUSTOMIZE_PATH}" ]]; then
            echo "KUSTOMIZE_PATH=." >> "${GITHUB_ENV}"
          fi

          required_vars=(
            PROJECT_ID
            GAR_LOCATION
            GKE_CLUSTER
            GKE_LOCATION
            DEPLOYMENT_NAME
            REPOSITORY
            IMAGE
            WORKLOAD_IDENTITY_PROVIDER
            GCP_SERVICE_ACCOUNT
          )

          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name}" ]]; then
              echo "::error::Missing required repository variable: ${var_name}"
              exit 1
            fi
          done

      - id: auth
        name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2' # google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.GCP_SERVICE_ACCOUNT }}'
          token_format: access_token

      - name: Docker Auth
        uses: 'docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567' # docker/login-action@v3
        with:
          username: oauth2accesstoken
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'

      - name: Set up GKE credentials
        uses: 'google-github-actions/get-gke-credentials@6051de21ad50fbb1767bc93c11357a49082ad116' # google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          location: '${{ env.GKE_LOCATION }}'

      - name: Build and push Docker container
        shell: bash
        run: |-
          set -euo pipefail
          DOCKER_TAG="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${GITHUB_SHA}"

          docker build \
            --tag "${DOCKER_TAG}" \
            --build-arg GITHUB_SHA="${GITHUB_SHA}" \
            --build-arg GITHUB_REF="${GITHUB_REF}" \
            .

          docker push "${DOCKER_TAG}"

      - name: Set up Kustomize
        shell: bash
        run: |-
          set -euo pipefail
          KUSTOMIZE_VERSION="5.4.3"
          curl -sSfL -o /tmp/kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          install -m 0755 /tmp/kustomize "${RUNNER_TEMP}/kustomize"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Deploy to GKE
        shell: bash
        run: |-
          set -euo pipefail
          DOCKER_TAG="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${GITHUB_SHA}"
          SOURCE_IMAGE="${KUSTOMIZE_IMAGE:-${IMAGE}}"
          RENDERED_MANIFEST="${RUNNER_TEMP}/gke-rendered-manifest.yaml"
          WORK_DIR="$(mktemp -d)"
          TARGET_NAMESPACE="${KUBERNETES_NAMESPACE:-}"
          REPO_ROOT="$(realpath "${GITHUB_WORKSPACE}")"
          KUSTOMIZE_DIR="${KUSTOMIZE_PATH:-.}"

          if [[ ! -d "${KUSTOMIZE_DIR}" ]]; then
            echo "::error::KUSTOMIZE_PATH does not exist: ${KUSTOMIZE_DIR}"
            exit 1
          fi

          LOGICAL_KUSTOMIZE_DIR="$(cd "${KUSTOMIZE_DIR}" && pwd)"
          PHYSICAL_KUSTOMIZE_DIR="$(cd "${KUSTOMIZE_DIR}" && pwd -P)"
          if [[ "${LOGICAL_KUSTOMIZE_DIR}" != "${PHYSICAL_KUSTOMIZE_DIR}" ]]; then
            echo "::error::KUSTOMIZE_PATH must not contain symlinks."
            exit 1
          fi

          ABS_KUSTOMIZE_DIR="$(realpath "${KUSTOMIZE_DIR}")"
          if [[ "${ABS_KUSTOMIZE_DIR}" != "${REPO_ROOT}" && "${ABS_KUSTOMIZE_DIR}" != "${REPO_ROOT}/"* ]]; then
            echo "::error::KUSTOMIZE_PATH must be within ${REPO_ROOT}"
            exit 1
          fi

          cd "${ABS_KUSTOMIZE_DIR}"
          if [[ ! -f "kustomization.yaml" && ! -f "kustomization.yml" ]]; then
            echo "::error::Missing kustomization.yaml or kustomization.yml in ${PWD}"
            exit 1
          fi

          cp -R "${ABS_KUSTOMIZE_DIR}/." "${WORK_DIR}/"
          cd "${WORK_DIR}"

          kustomize edit set image "${SOURCE_IMAGE}=${DOCKER_TAG}"
          kustomize build . > "${RENDERED_MANIFEST}"
          kubectl apply -f "${RENDERED_MANIFEST}"

          if [[ -n "${TARGET_NAMESPACE}" ]]; then
            kubectl rollout status deployment/"${DEPLOYMENT_NAME}" --namespace "${TARGET_NAMESPACE}"
            kubectl get services --namespace "${TARGET_NAMESPACE}" -o wide
          else
            kubectl rollout status deployment/"${DEPLOYMENT_NAME}"
            kubectl get services -o wide
          fi
